[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lhd"
version = "0.1.0"
description = "Layer Health Diagnostics: early detection of silent training failures in neural networks"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
experiments = ["torch>=2.0", "torchvision", "pyarrow", "scipy", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]